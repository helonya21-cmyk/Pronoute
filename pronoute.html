<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronoute — Collège Jean Helon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#17253F;
    --blue:#2F5FA0;
    --blue-light:#EAF0F9;
    --gold:#C89B3C;
    --paper:#EEF1F6;
    --card:#FFFFFF;
    --ink:#1B2230;
    --ink-soft:#5B6472;
    --line:#DDE2EA;
    --success:#2E7D4F;
    --success-bg:#E7F4EC;
    --danger:#B23A34;
    --danger-bg:#FBEAE9;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',sans-serif;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Public Sans',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Public Sans',sans-serif;}

  /* ---------- Crest ---------- */
  .crest{
    width:46px;height:46px;border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(200,155,60,0.12);
    background:var(--navy);
  }
  .crest img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1d3155 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 110%, #1d3155 0%, transparent 55%),
      var(--navy);
    padding:24px;
  }
  .login-card{
    background:var(--card);width:100%;max-width:400px;border-radius:14px;
    padding:38px 34px 30px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
    position:relative;
  }
  .login-head{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px;text-align:center;}
  .login-head .crest{width:60px;height:60px;font-size:19px;}
  .login-head h1{font-size:22px;letter-spacing:0.2px;color:var(--navy);}
  .login-head p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;letter-spacing:0.4px;text-transform:uppercase;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.2px;}
  .field input{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;
    font-size:14.5px;background:#FAFBFD;transition:border-color .15s;
  }
  .field input:focus{outline:none;border-color:var(--blue);background:#fff;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:40px !important;}
  .pw-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    font-size:17px;padding:6px;line-height:1;border-radius:6px;
  }
  .pw-toggle:hover{background:var(--paper);color:var(--ink);}
  .btn-primary{
    width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);color:#fff;
    font-weight:600;font-size:14.5px;letter-spacing:0.2px;transition:background .15s;
  }
  .btn-primary:hover{background:#233A61;}
  .login-error{
    background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:10px 12px;
    font-size:13px;margin-bottom:16px;display:none;
  }
  .login-foot{margin-top:20px;text-align:center;font-size:12px;color:var(--ink-soft);}

  /* ---------- App shell ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;background:var(--navy);color:#fff;flex-shrink:0;
    display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
    transition:width .2s ease, padding .2s ease;
  }
  .sidebar.collapsed{width:74px;padding:20px 10px;}
  .sb-head{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:16px;position:relative;}
  .sb-head .crest{width:38px;height:38px;font-size:13px;}
  .sb-head-text{line-height:1.2;overflow:hidden;white-space:nowrap;}
  .sidebar.collapsed .sb-head-text{display:none;}
  .sb-head-text b{font-family:'Fraunces',serif;font-size:15.5px;display:block;}
  .sb-head-text span{font-size:10.5px;color:#B9C3D6;text-transform:uppercase;letter-spacing:0.5px;}
  .sb-collapse-btn{
    margin-left:auto;background:rgba(255,255,255,0.08);border:none;color:#CBD5E5;
    width:24px;height:24px;border-radius:6px;font-size:13px;flex-shrink:0;
  }
  .sb-collapse-btn:hover{background:rgba(255,255,255,0.16);color:#fff;}
  .sidebar.collapsed .sb-collapse-btn{margin-left:0;position:absolute;right:-4px;top:-2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:#CBD5E5;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
    border:none;background:transparent;width:100%;text-align:left;transition:background .15s;
  }
  .sidebar.collapsed .nav-item{justify-content:center;padding:10px 0;}
  .nav-icon{font-size:15px;flex-shrink:0;width:18px;text-align:center;}
  .nav-label{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:var(--blue);color:#fff;}
  .sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
  .sb-user{padding:8px;border-radius:8px;background:rgba(255,255,255,0.05);margin-bottom:8px;}
  .sb-user b{font-size:13px;display:block;}
  .sb-user span{font-size:11px;color:#B9C3D6;text-transform:uppercase;letter-spacing:0.4px;}
  .btn-logout{
    width:100%;padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);
    background:transparent;color:#CBD5E5;font-size:12.5px;font-weight:500;
  }
  .btn-logout:hover{background:rgba(255,255,255,0.06);color:#fff;}

  .main{flex:1;padding:32px 40px;max-width:1100px;}
  .page-head{margin-bottom:26px;}
  .eyebrow{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:6px;}
  .page-head h2{font-size:26px;color:var(--navy);}
  .page-sub{color:var(--ink-soft);font-size:14px;margin-top:6px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;}
  .card h3{font-size:16px;color:var(--navy);margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;padding:8px 10px;border-bottom:2px solid var(--line);}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--blue);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.3px;}
  .tag-admin{background:#F3E8D9;color:#8A6414;}
  .tag-prof{background:var(--blue-light);color:var(--blue);}
  .tag-eleve{background:var(--success-bg);color:var(--success);}
  .tag-personnel{background:#EFE9F5;color:#6C4A9C;}
  .tag-infirmier{background:#FCE4E9;color:#A03A5C;}
  .tag-surveillant{background:#E4F1F8;color:#1E6F8E;}
  .vie-dot.colle{background:#6C4A9C;}
  .statut-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .statut-badge.aeffectuer{background:#FBEAE9;color:var(--danger);}
  .statut-badge.effectuee{background:var(--success-bg);color:var(--success);}

  .btn-sm{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);}
  .btn-sm:hover{background:#F5F6F8;}
  .btn-sm.danger{color:var(--danger);border-color:#EFC9C6;}
  .btn-sm.danger:hover{background:var(--danger-bg);}
  .btn-add{padding:9px 16px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:600;font-size:13px;}
  .btn-add:hover{background:#254B85;}

  .field-inline{display:flex;flex-direction:column;gap:5px;}
  .field-inline label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field-inline input, .field-inline select, .field-inline textarea{
    padding:9px 11px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;background:#FAFBFD;
  }
  .field-inline input:focus, .field-inline select:focus, .field-inline textarea:focus{outline:none;border-color:var(--blue);background:#fff;}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
  .form-row .field-inline{flex:1;min-width:130px;}

  .empty{color:var(--ink-soft);font-size:13.5px;padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:8px;}

  .day-col{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:60px;}
  .day-title{background:var(--navy);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:8px;text-transform:uppercase;letter-spacing:0.5px;}
  .slot{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .slot:last-child{border-bottom:none;}
  .slot b{display:block;color:var(--navy);font-size:12.5px;}
  .slot-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .slot-actions .btn-sm{padding:4px 8px;font-size:11px;}
  .btn-ghost{padding:10px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:13.5px;}
  .btn-ghost:hover{background:var(--paper);}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,15,25,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-card{background:var(--card);border-radius:12px;padding:28px 26px;max-width:400px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);}
  .modal-card h3{font-size:17px;color:var(--navy);margin-bottom:6px;}
  .modal-card .sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn-primary{width:auto;flex:1;}
  .modal-actions .btn-ghost{flex:1;}
  .slot .heure{font-family:'IBM Plex Mono',monospace;color:var(--blue);font-size:11px;font-weight:600;}
  .slot .salle{color:var(--ink-soft);font-size:11px;}
  .slot .del{float:right;color:var(--danger);cursor:pointer;font-size:11px;}
  .edt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  @media (max-width:900px){.edt-grid{grid-template-columns:1fr;}}

  .devoir-item{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:#fff;}
  .devoir-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .devoir-item .matiere{font-weight:700;color:var(--navy);font-size:14px;}
  .devoir-item .date{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--blue);background:var(--blue-light);padding:2px 8px;border-radius:5px;}
  .devoir-item p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.5;}
  .devoir-item .meta{margin-top:8px;font-size:11.5px;color:var(--ink-soft);}

  .vie-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .vie-item:last-child{border-bottom:none;}
  .vie-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .vie-dot.absence{background:var(--danger);}
  .vie-dot.retard{background:var(--gold);}
  .vie-dot.sanction{background:#8A2E2A;}
  .vie-dot.observation{background:var(--blue);}
  .vie-item .desc{font-size:13.5px;}
  .vie-item .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;
    border-radius:8px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,0.25);opacity:0;
    transform:translateY(10px);transition:all .25s;pointer-events:none;z-index:99;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
  @media (max-width:800px){.stat-row{grid-template-columns:1fr 1fr;}}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:28px;color:var(--navy);}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}

  ::selection{background:var(--gold);color:#1B2230;}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

async function loadKey(key, fallback){
  try{
    const { data, error } = await db.from("kv_store").select("value").eq("key", key).maybeSingle();
    if(error || !data) return fallback;
    return data.value;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{
    const { error } = await db.from("kv_store").upsert({ key, value });
    if(error) showToast("Erreur de sauvegarde — réessaie.");
  }catch(e){ showToast("Erreur de sauvegarde — réessaie."); }
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

// Active tous les boutons "œil" présents dans le DOM à un instant donné.
// À appeler après chaque rendu HTML qui contient un champ .pw-wrap.
function wirePasswordToggles(root){
  (root || document).querySelectorAll(".pw-toggle").forEach(btn=>{
    if(btn._wired) return;
    btn._wired = true;
    btn.addEventListener("click", ()=>{
      const input = document.getElementById(btn.dataset.toggleFor);
      if(!input) return;
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.textContent = show ? "🙈" : "👁";
    });
  });
}

/* ---------------- Auth ---------------- */
function tryLogin(identifiant, password){
  if(identifiant === ADMIN.identifiant && password === ADMIN.password){
    return ADMIN;
  }
  return state.users.find(u => u.identifiant === identifiant && u.password === password) || null;
}

function render(){
  if(!state.loaded){
    document.getElementById("app").innerHTML = `<div class="login-wrap"><p style="color:#fff">Chargement…</p></div>`;
    return;
  }
  if(!state.currentUser){
    renderLogin();
  } else {

  }
}

/* ---------------- App shell ---------------- */
function navItemsFor(role){
  const base = [{id:"accueil", label:"Accueil", icon:"🏠"}];
  if(role==="admin") base.push({id:"comptes", label:"Comptes", icon:"👥"}, {id:"classes", label:"Classes", icon:"🏫"});
  if(["admin","prof","eleve","personnel"].includes(role)) base.push({id:"edt", label:"Emploi du temps", icon:"🗓️"});
  if(["admin","prof","eleve","personnel"].includes(role)) base.push({id:"devoirs", label:"Devoirs", icon:"📚"});
  if(["admin","prof","eleve","surveillant"].includes(role)) base.push({id:"vie", label:"Vie scolaire", icon:"📋"});
  if(["admin","surveillant","eleve","prof"].includes(role)) base.push({id:"colles", label:"Heures de colle", icon:"⏱️"});
  if(["admin","infirmier","eleve"].includes(role)) base.push({id:"infirmerie", label:"Infirmerie", icon:"✚"});
  base.push({id:"messagerie", label:"Messagerie", icon:"✉️"});
  return base;
}
const roleLabel = {
  admin:"Administration", prof:"Professeur", eleve:"Élève", personnel:"Personnel",
  infirmier:"Infirmier(ère)", surveillant:"Surveillant(e)"
};

function renderApp(){
  const u = state.currentUser;
  const items = navItemsFor(u.role);
  const collapsed = state.sidebarCollapsed;
  document.getElementById("app").innerHTML = `
  <div class="app">
    <div class="sidebar ${collapsed ? "collapsed":""}">
      <div class="sb-head">
        <div class="crest"><img src="${LOGO_DATA_URL}" alt="Collège Jean Helon"></div>
        <div class="sb-head-text"><b>Pronoute</b><span>Jean Helon</span></div>
        <button class="sb-collapse-btn" id="collapseBtn" title="Replier le menu">${collapsed ? "»" : "«"}</button>
      </div>
      <div id="navList"></div>
      <div class="sb-foot">
        <div class="sb-user">
          <b>${u.prenom} ${u.nom}</b>
          <span>${roleLabel[u.role]}${u.classe? " · "+u.classe : ""}</span>
        </div>
        <button class="btn-logout" id="logoutBtn">${collapsed ? "↩" : "Se déconnecter"}</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>`;

  const navList = document.getElementById("navList");
  items.forEach(it=>{
    const btn = document.createElement("button");
    btn.className = "nav-item" + (state.page===it.id ? " active":"");
    btn.title = it.label;
    btn.innerHTML = `<span class="nav-icon">${it.icon}</span>${collapsed ? "" : `<span class="nav-label">${it.label}</span>`}`;
    btn.addEventListener("click", ()=>{ state.page = it.id; render(); });
    navList.appendChild(btn);
  });
  document.getElementById("collapseBtn").addEventListener("click", ()=>{
    state.sidebarCollapsed = !state.sidebarCollapsed;
    localStorage.setItem("pronoute-sidebar-collapsed", state.sidebarCollapsed ? "1" : "0");
    render();
  });
  document.getElementById("logoutBtn").addEventListener("click", ()=>{
    state.currentUser = null; render();
  });

  renderPage();
}

function renderPage(){
  const main = document.getElementById("mainArea");
  const u = state.currentUser;
  if(state.page==="accueil") return renderAccueil(main, u);
  if(state.page==="comptes" && u.role==="admin") return renderComptes(main);
  if(state.page==="classes" && u.role==="admin") return renderClasses(main);
  if(state.page==="edt") return renderEDT(main, u);
  if(state.page==="devoirs") return renderDevoirs(main, u);
  if(state.page==="vie" && ["admin","prof","eleve","surveillant"].includes(u.role)) return renderVie(main, u);
  if(state.page==="colles" && ["admin","surveillant","eleve","prof"].includes(u.role)) return renderColles(main, u);
  if(state.page==="infirmerie" && ["admin","infirmier","eleve"].includes(u.role)) return renderInfirmerie(main, u);
  if(state.page==="messagerie") return renderMessagerie(main, u);
  main.innerHTML = `<div class="empty">Page introuvable.</div>`;
}

        return va < vb ? -1*dir : va > vb ? 1*dir : 0;

        ${editing ? `<button class="btn-ghost" id="cancelEditBtn" style="flex:0 0 auto;padding:9px 16px;">Annuler la modification</button>` : ""}
      </div>
    </div>` : ""}
    <div class="edt-grid" id="edtGrid"></div>
    <div class="card">
      <h3>Cours annulés — ${selectedClasse||""}</h3>
      <div id="annulationsList"></div>
    </div>
  `;

  if(u.role!=="eleve"){
    document.getElementById("edtClasseSelect").addEventListener("change", e=>{
      window._edtSelected = e.target.value;
      window._edtEditing = null;
      renderEDT(main, u);
    });
  }

  if(canManage){
    document.getElementById("addSlotBtn").addEventListener("click", async ()=>{
      const classe = selectedClasse;
      if(!classe){ showToast("Crée d'abord une classe."); return; }
      const jour = document.getElementById("eJour").value;
      const debut = document.getElementById("eDebut").value;
      const fin = document.getElementById("eFin").value;
      const matiere = document.getElementById("eMatiere").value.trim();
      const prof = document.getElementById("eProf").value.trim();
      const salle = document.getElementById("eSalle").value.trim();
      if(!matiere){ showToast("Indique une matière."); return; }
      if(!state.edt[classe]) state.edt[classe] = [];
      if(editing){
        const slot = state.edt[classe].find(s=>s.id===editing.id) || (state.edt[editing.classe]||[]).find(s=>s.id===editing.id);
        // Si la classe a changé n'est pas géré ici : on modifie le cours dans sa classe d'origine
        const list = state.edt[editing.classe] || [];
        const idx = list.findIndex(s=>s.id===editing.id);
        if(idx !== -1){ list[idx] = { ...list[idx], jour, debut, fin, matiere, prof, salle }; }
        window._edtEditing = null;
        await saveKey("pronoute:edt", state.edt);
        showToast("Cours modifié.");
      } else {
        state.edt[classe].push({ id: uid(), jour, debut, fin, matiere, prof, salle });
        await saveKey("pronoute:edt", state.edt);
        showToast("Cours ajouté.");
      }
      renderEDT(main, u);
    });
    if(editing){
      document.getElementById("cancelEditBtn").addEventListener("click", ()=>{
        window._edtEditing = null;
        renderEDT(main, u);
      });
    }
  }

  const grid = document.getElementById("edtGrid");
  const slotsForClasse = (state.edt[selectedClasse] || []);
  grid.innerHTML = JOURS.map(jour=>{
    const daySlots = slotsForClasse.filter(s=>s.jour===jour).sort((a,b)=>a.debut.localeCompare(b.debut));
    return `<div class="day-col">
      <div class="day-title">${jour}</div>
      ${daySlots.length ? daySlots.map(s=>`
        <div class="slot">
          ${canManage ? `<span class="del" data-id="${s.id}">✕</span>` : ""}
          <span class="heure">${s.debut} – ${s.fin}</span>
          <b>${s.matiere}</b>
          <span class="salle">${s.prof ? s.prof+" · " : ""}${s.salle||""}</span>
          <div class="slot-actions">
            ${canManage ? `<button class="btn-sm" data-edit="${s.id}">Modifier</button>` : ""}
            ${canCancel ? `<button class="btn-sm danger" data-cancel="${s.id}">Annuler une séance</button>` : ""}
          </div>
        </div>
      `).join("") : `<div class="slot" style="color:var(--ink-soft);">Aucun cours</div>`}
    </div>`;
  }).join("");

  if(canManage){
    grid.querySelectorAll(".del").forEach(el=>{
      el.addEventListener("click", async ()=>{
        state.edt[selectedClasse] = state.edt[selectedClasse].filter(s=>s.id!==el.dataset.id);
        await saveKey("pronoute:edt", state.edt);
        renderEDT(main, u);
      });
    });
    grid.querySelectorAll("button[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const slot = slotsForClasse.find(s=>s.id===btn.dataset.edit);
        window._edtEditing = { ...slot, classe: selectedClasse };
        renderEDT(main, u);
        main.scrollIntoView({ behavior:"smooth" });
      });
    });
  }
  if(canCancel){
    grid.querySelectorAll("button[data-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const slot = slotsForClasse.find(s=>s.id===btn.dataset.cancel);
        state.cancelModalSlot = { ...slot, classe: selectedClasse };
        renderCancelModal(u, ()=>renderEDT(main, u));
      });
    });
  }

  const annulList = state.annulations.filter(a=>a.classe===selectedClasse).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  document.getElementById("annulationsList").innerHTML = annulList.length ? annulList.map(a=>`
    <div class="vie-item">
      <div class="vie-dot sanction"></div>
      <div style="flex:1">
        <div class="desc"><b>${a.matiere}</b> annulé le ${a.date || "—"}${a.motif ? " — "+a.motif : ""}</div>
        <div class="meta">Signalé par ${a.annulePar || "—"}
          ${u.role==="admin" ? `<button class="btn-sm" data-restore="${a.id}" style="margin-left:8px;">Rétablir</button>` : ""}
        </div>
      </div>
    </div>`).join("") : `<div class="empty">Aucun cours annulé pour cette classe.</div>`;
  document.getElementById("annulationsList").querySelectorAll("button[data-restore]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      state.annulations = state.annulations.filter(a=>a.id!==btn.dataset.restore);
      await saveKey("pronoute:annulations", state.annulations);
      showToast("Cours rétabli.");
      renderEDT(main, u);
    });
  });
}

/* ---------------- Modale : annuler une séance de cours ---------------- */
function renderCancelModal(u, onClose){
  const existing = document.getElementById("cancelModalOverlay");
  if(existing) existing.remove();
  const slot = state.cancelModalSlot;
  if(!slot) return;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "cancelModalOverlay";
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>Annuler une séance</h3>
      <div class="sub">${slot.matiere} — ${slot.jour} ${slot.debut}-${slot.fin} (${slot.classe})</div>
      <div class="field"><label>Date de la séance annulée</label><input type="date" id="cancelDate"></div>
      <div class="field"><label>Motif (optionnel)</label><input id="cancelMotif" placeholder="Ex : Professeur absent"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelModalClose">Fermer</button>
        <button class="btn-primary" id="cancelModalSubmit">Confirmer l'annulation</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=>{ state.cancelModalSlot = null; overlay.remove(); if(onClose) onClose(); };
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) close(); });
  document.getElementById("cancelModalClose").addEventListener("click", close);
  document.getElementById("cancelModalSubmit").addEventListener("click", async ()=>{
    const date = document.getElementById("cancelDate").value;
    if(!date){ showToast("Choisis une date."); return; }
    const motif = document.getElementById("cancelMotif").value.trim();
    state.annulations.push({
      id: uid(), classe: slot.classe, slotId: slot.id, matiere: slot.matiere,
      date, motif, annulePar: u.prenom+" "+u.nom
    });
    await saveKey("pronoute:annulations", state.annulations);
    showToast("Cours annulé.");
    close();
  });
}

          </select>
        </div>
        <div class="field-inline" id="mDestEleveWrap"><label>Élève</label>
          <select id="mDestEleve">${eleves.length ? eleves.map(e=>`<option value="${e.id}">${e.prenom} ${e.nom} (${e.classe||""})</option>`).join("") : `<option value="">Aucun élève créé</option>`}</select>
        </div>
        <div class="field-inline" id="mDestClasseWrap" style="display:none"><label>Classe</label>
          <select id="mDestClasse">${state.classes.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
        </div>
      </div>` : `
      <div class="form-row">
        <div class="field-inline"><label>Professeur</label>
          <select id="mDestProf">${profs.length ? profs.map(p=>`<option value="${p.id}">${p.prenom} ${p.nom}${p.matiere ? " — "+p.matiere : ""}</option>`).join("") : `<option value="">Aucun professeur créé</option>`}</select>
        </div>
      </div>`}
      <div class="field-inline" style="margin-bottom:14px;"><label>Message</label><textarea id="mContenu" rows="3" placeholder="Écris ton message ici…"></textarea></div>
      <button class="btn-add" id="sendMsgBtn">Envoyer</button>
    </div>
    <div class="card"><h3>Historique</h3><div id="messagesList"></div></div>
  `;

  if(isStaff){
    document.getElementById("mDestType").addEventListener("change", e=>{
      const isClasse = e.target.value === "classe";
      document.getElementById("mDestEleveWrap").style.display = isClasse ? "none":"flex";
      document.getElementById("mDestClasseWrap").style.display = isClasse ? "flex":"none";
    });
  }

  document.getElementById("sendMsgBtn").addEventListener("click", async ()=>{
    const contenu = document.getElementById("mContenu").value.trim();
    if(!contenu){ showToast("Écris un message avant d'envoyer."); return; }
    let msg = {
      id: uid(), fromId: u.id, fromNom: u.prenom+" "+u.nom, fromRole: u.role,
      contenu, date: new Date().toISOString().slice(0,16).replace("T"," ")
    };
    if(isStaff){
      const destType = document.getElementById("mDestType").value;
      if(destType==="classe"){
        const classe = document.getElementById("mDestClasse").value;
        if(!classe){ showToast("Crée d'abord une classe."); return; }
        msg.toType = "classe"; msg.toId = classe; msg.toLabel = "Classe " + classe;
      } else {
        if(!eleves.length){ showToast("Crée d'abord un compte élève."); return; }
        const eleveId = document.getElementById("mDestEleve").value;
        const eleve = eleves.find(e=>e.id===eleveId);
        msg.toType = "user"; msg.toId = eleveId; msg.toLabel = eleve ? eleve.prenom+" "+eleve.nom : "Élève";
      }
    } else {
      if(!profs.length){ showToast("Aucun professeur n'a encore de compte."); return; }
      const profId = document.getElementById("mDestProf").value;
      const prof = profs.find(p=>p.id===profId);
      msg.toType = "user"; msg.toId = profId; msg.toLabel = prof ? prof.prenom+" "+prof.nom : "Professeur";
    }
    state.messages.push(msg);
    await saveKey("pronoute:messages", state.messages);
    showToast("Message envoyé.");
    renderMessagerie(main, u);
  });

  let list = state.messages.filter(m=>{
    if(m.fromId === u.id) return true;
    if(m.toType==="user" && m.toId===u.id) return true;
    if(m.toType==="classe" && u.classe && m.toId===u.classe) return true;
    return false;
  });
  list.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  document.getElementById("messagesList").innerHTML = list.length ? list.map(m=>messageItemHTML(m, u)).join("") : `<div class="empty">Aucun message pour le moment.</div>`;
}

/* ---------------- Boot ---------------- */
(async function boot(){
  render();
  await loadAll();
  render();
})();
</script>
</body>
</html>
